# Optional: deploy from the command line instead of the dashboard.
#   npm i -g wrangler
#   wrangler login
#   wrangler secret put TMDB_KEY        (paste your TMDB key when asked)
#   wrangler deploy
name = "flickerz-tmdb"
main = "tmdb-proxy.js"
compatibility_date = "2024-11-01"

[vars]
# Comma-separated list of sites allowed to use this proxy. Leave empty while
# testing from a preview URL, then set it to your real domain(s).
ALLOWED_ORIGINS = ""
