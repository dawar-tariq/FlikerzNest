<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>About | Flickerz Nest</title>
<!--
  Information pages: About us, Contact, Privacy, Terms, DMCA.
  about.html           -> About us
  about.html#contact   -> Contact
  about.html#privacy   -> Privacy policy
  about.html#terms     -> Terms of use
  about.html#dmca      -> DMCA
-->
<style>
  html,body{margin:0;height:100%;background:#0a0b0f;color:#f3f4f7;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .boot{display:grid;place-items:center;height:100%;gap:14px;text-align:center}
  .ring{width:46px;height:46px;border:3px solid rgba(255,255,255,.12);border-top-color:#e50914;border-radius:50%;animation:spin .9s linear infinite}
  p{margin:0;color:#9aa0ad;font-size:14px} a{color:#fff}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
<script>
  (function () {
    var h = (location.hash || "").replace(/^#\/?/, "").toLowerCase();
    var ok = { about: 1, contact: 1, privacy: 1, terms: 1, dmca: 1 };
    var page = ok[h] ? h : "about";
    var target = "index.html?page=" + page + "#" + page;
    try { location.replace(target); } catch (e) { location.href = target; }
  })();
</script>
</head>
<body>
  <div class="boot"><div class="ring"></div><p>Loading&hellip;</p><p><a href="index.html#about">Continue</a></p></div>
</body>
</html>
