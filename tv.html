<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0c10">
<title>Flickerz Nest is not available on TV yet</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:#090a0e;color:#f4f5f8;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:32px;
    background:radial-gradient(900px 600px at 50% 0%,rgba(229,9,20,.18),transparent 70%),linear-gradient(145deg,#090a0e,#11131b 65%,#090a0e)}
  main{width:min(780px,100%);padding:clamp(28px,5vw,62px);border:1px solid rgba(255,255,255,.12);border-radius:28px;
    background:rgba(20,22,29,.9);box-shadow:0 32px 100px rgba(0,0,0,.55);text-align:center}
  .mark{width:62px;height:62px;display:grid;place-items:center;margin:0 auto 24px;border-radius:18px 18px 18px 5px;
    background:linear-gradient(140deg,#ff3342,#a30610);color:#fff;font-size:30px;font-weight:800;box-shadow:0 12px 34px rgba(229,9,20,.32)}
  .brand{margin:0 0 14px;color:#ff858c;font-size:13px;font-weight:800;letter-spacing:.2em;text-transform:uppercase}
  h1{margin:0;font-size:clamp(32px,5vw,54px);line-height:1.08;letter-spacing:-.045em}
  .copy{max-width:590px;margin:22px auto 0;color:#b5bac5;font-size:clamp(16px,2vw,21px);line-height:1.7}
  .foot{margin:30px 0 0;color:#f0f1f5;font-size:15px;font-weight:700}
  .note{margin:12px 0 0;color:#858b99;font-size:13px}
  a{display:inline-flex;align-items:center;justify-content:center;min-height:46px;margin-top:28px;padding:0 22px;border-radius:10px;
    background:#e50914;color:#fff;text-decoration:none;font-size:14px;font-weight:700}
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">F</div>
  <p class="brand">Flickerz Nest</p>
  <h1>Not available on TV yet</h1>
  <p class="copy">Flickerz Nest isn't available on TV browsers right now. We're working to make the experience compatible with televisions.</p>
  <p class="foot">For now, please use a phone, tablet or computer.</p>
  <p class="note">Thank you for your patience.</p>
  <a href="/">Open Flickerz Nest</a>
</main>
</body>
</html>
