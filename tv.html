<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Flickerz Nest on TV</title>
<!--
  TV page. Open this on any TV browser (or add it as a bookmark / home-screen
  shortcut on the TV). It forces TV mode: remote-control navigation, large
  text, and the code sign-in shown right away for anyone not signed in.
  Members approve the code from the account menu on their phone or computer.
-->
<style>
  html,body{margin:0;height:100%;background:#0a0b0f;color:#f3f4f7;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .boot{display:grid;place-items:center;height:100%;gap:14px;text-align:center}
  .ring{width:56px;height:56px;border:4px solid rgba(255,255,255,.12);border-top-color:#e50914;border-radius:50%;animation:spin .9s linear infinite}
  p{margin:0;color:#9aa0ad;font-size:20px} a{color:#fff}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
<script>
  (function () {
    var target = "index.html?page=tv&tv=1" + (location.hash || "#top");
    try { location.replace(target); } catch (e) { location.href = target; }
  })();
</script>
</head>
<body>
  <div class="boot"><div class="ring"></div><p>Starting Flickerz Nest for TV&hellip;</p><p><a href="index.html?page=tv&tv=1">Continue</a></p></div>
</body>
</html>
