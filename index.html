<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flickerz Nest</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .movie-card:hover .card-overlay { opacity: 1; }
  </style>
</head>
<body class="bg-neutral-950 text-white min-h-screen font-sans antialiased selection:bg-red-600 selection:text-white">

  <!-- Header Navigation -->
  <header class="fixed top-0 left-0 right-0 z-50 transition-colors duration-300 bg-gradient-to-b from-black/80 to-transparent" id="navbar">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-8">
        <a href="#" class="flex items-center space-x-2 text-red-600 font-bold text-xl tracking-wider">
          <span class="bg-red-600 text-white rounded p-1 text-xs">F</span>
          <span>Flickerz Nest</span>
        </a>
        <nav class="hidden md:flex space-x-6 text-sm font-medium text-neutral-300">
          <a href="#" class="hover:text-white transition">Home</a>
          <a href="#movies" class="hover:text-white transition">Films</a>
          <a href="#series" class="hover:text-white transition">Series</a>
          <a href="#watchlist" class="hover:text-white transition">My List</a>
        </nav>
      </div>
      <div class="flex items-center space-x-4">
        <div class="relative">
          <input type="text" id="search-input" placeholder="Titles, people, genres..." 
                 class="bg-neutral-900/80 border border-neutral-800 text-xs text-white rounded-full py-1.5 pl-8 pr-4 w-36 sm:w-64 focus:outline-none focus:border-neutral-600 transition-all placeholder-neutral-500">
          <svg class="w-4 h-4 text-neutral-400 absolute left-2.5 top-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </div>
      </div>
    </div>
  </header>

  <!-- Hero Banner -->
  <section id="hero" class="relative h-[80vh] w-full bg-neutral-900 flex items-end pb-12 overflow-hidden">
    <div id="hero-bg" class="absolute inset-0 bg-cover bg-center transition-all duration-700 brightness-75"></div>
    <div class="absolute inset-0 bg-gradient-to-t from-neutral-950 via-neutral-950/40 to-transparent"></div>
    <div class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 z-10 w-full" id="hero-content">
      <!-- Dynamic Hero Content Rendered Here -->
    </div>
  </section>

  <!-- Main Content Areas -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 -mt-16 relative z-20 space-y-10 pb-16">
    <section id="search-results-section" class="hidden">
      <h2 class="text-xl font-bold mb-4 tracking-wide text-neutral-200">Search Results</h2>
      <div id="search-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4"></div>
    </section>

    <section>
      <h2 class="text-xl font-bold mb-4 tracking-wide text-neutral-200">Trending Movies</h2>
      <div id="trending-movies" class="flex space-x-4 overflow-x-auto no-scrollbar py-2 scroll-smooth"></div>
    </section>

    <section>
      <h2 class="text-xl font-bold mb-4 tracking-wide text-neutral-200">Popular TV Shows</h2>
      <div id="popular-tv" class="flex space-x-4 overflow-x-auto no-scrollbar py-2 scroll-smooth"></div>
    </section>

    <section id="watchlist-section">
      <h2 class="text-xl font-bold mb-4 tracking-wide text-neutral-200">My Watchlist</h2>
      <div id="watchlist-grid" class="flex space-x-4 overflow-x-auto no-scrollbar py-2 scroll-smooth"></div>
    </section>
  </main>

  <!-- Video Stream Player Modal -->
  <div id="player-modal" class="fixed inset-0 z-50 bg-black/95 hidden flex items-center justify-center p-2 sm:p-6">
    <div class="relative w-full max-w-5xl aspect-video bg-neutral-900 rounded-lg overflow-hidden border border-neutral-800 shadow-2xl">
      <button id="close-player" class="absolute top-3 right-3 z-10 bg-neutral-800/80 hover:bg-neutral-700 text-white rounded-full p-2 transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
      <iframe id="player-frame" class="w-full h-full border-0" allowfullscreen></iframe>
    </div>
  </div>

  <!-- Core Application Script -->
  <script>
    (() => {
      // 1. HARDCODED CONFIGURATION & CENTRALIZED STATE
      const state = {
        config: {
          tmdbApiKey: 'cc306d0684189df48d37b51bc9e06e04'
          supabaseUrl: 'https://ctbrfynxmgcyvsrdihfg.supabase.co'
          supabaseKey: 'sb_publishable_4BX5xVy7t6lxpDltwkq2WA_JXb0tVC'
        },
        supabase: null,
        watchlist: [],
        customStreams: {},
        searchSequence: 0
      };

      const TMDB_IMAGE_BASE = 'https://image.tmdb.org/t/p/w500';
      const TMDB_HERO_BASE = 'https://image.tmdb.org/t/p/original';

      // Fallback Data
      const fallbackMovies = [
        { id: 823464, title: 'Godzilla x Kong', media_type: 'movie', poster_path: '/z19A13mR2y3fR2y3.jpg', backdrop_path: '/xOMo8BRK7PfcJv9.jpg', overview: 'An epic battle continues...' },
        { id: 693134, title: 'Dune: Part Two', media_type: 'movie', poster_path: '/1pdfL2iA83S2y3fR2y3.jpg', backdrop_path: '/xOMo8BRK7PfcJv9.jpg', overview: 'Paul Atreides unites with Chani...' }
      ];

      // 2. INITIALIZATION
      function init() {
        initSupabase();
        setupEventListeners();
        fetchTrendingData();
      }

      function initSupabase() {
        if (state.config.supabaseUrl && state.config.supabaseKey && window.supabase) {
          state.supabase = window.supabase.createClient(state.config.supabaseUrl, state.config.supabaseKey);
          syncWatchlist();
          subscribeToRealtime();
        }
      }

      // 3. DATA FETCHING & API INTERACTION
      async function tmdbFetch(endpoint) {
        if (!state.config.tmdbApiKey) return null;
        try {
          const res = await fetch(`https://api.themoviedb.org/3${endpoint}?api_key=${state.config.tmdbApiKey}`);
          return await res.json();
        } catch (e) {
          console.error("TMDB Fetch Error:", e);
          return null;
        }
      }

      async function fetchTrendingData() {
        const movies = await tmdbFetch('/trending/movie/week');
        const tv = await tmdbFetch('/trending/tv/week');

        const movieData = movies && movies.results ? movies.results : fallbackMovies;
        const tvData = tv && tv.results ? tv.results : fallbackMovies;

        if (movieData.length > 0) renderHero(movieData[0]);
        renderCarousel('trending-movies', movieData, 'movie');
        renderCarousel('popular-tv', tvData, 'tv');
      }

      // 4. REALTIME SUPABASE SYNCING
      async function syncWatchlist() {
        if (!state.supabase) return;
        const { data, error } = await state.supabase.from('watchlist').select('*');
        if (!error && data) {
          state.watchlist = data;
          renderWatchlist();
        }
      }

      function subscribeToRealtime() {
        if (!state.supabase) return;
        state.supabase.channel('public:watchlist')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'watchlist' }, () => {
            syncWatchlist();
          })
          .subscribe();
      }

      async function toggleWatchlist(item) {
        if (!state.supabase) return;
        const exists = state.watchlist.some(w => w.media_id === item.id.toString());
        if (exists) {
          await state.supabase.from('watchlist').delete().eq('media_id', item.id.toString());
        } else {
          await state.supabase.from('watchlist').insert([{
            media_id: item.id.toString(),
            title: item.title || item.name,
            poster_path: item.poster_path,
            media_type: item.media_type || 'movie'
          }]);
        }
        syncWatchlist();
      }

      // 5. RENDERING UI
      function renderHero(item) {
        const heroBg = document.getElementById('hero-bg');
        const heroContent = document.getElementById('hero-content');
        
        heroBg.style.backgroundImage = `url('${item.backdrop_path ? TMDB_HERO_BASE + item.backdrop_path : ''}')`;
        heroContent.innerHTML = `
          <h1 class="text-3xl sm:text-5xl font-extrabold mb-3 tracking-tight">${item.title || item.name}</h1>
          <p class="text-sm sm:text-base text-neutral-300 max-w-2xl line-clamp-3 mb-6">${item.overview}</p>
          <div class="flex space-x-3">
            <button onclick="window.openPlayer('${item.id}', '${item.media_type || 'movie'}')" class="bg-red-600 hover:bg-red-700 text-white font-semibold px-6 py-2.5 rounded-md flex items-center space-x-2 transition">
              <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M4 4l12 6-12 6V4z"/></svg>
              <span>Play Now</span>
            </button>
          </div>
        `;
      }

      function renderCarousel(elementId, items, defaultType) {
        const container = document.getElementById(elementId);
        container.innerHTML = items.map(item => createMediaCard(item, defaultType)).join('');
      }

      function createMediaCard(item, defaultType) {
        const type = item.media_type || defaultType;
        const poster = item.poster_path ? TMDB_IMAGE_BASE + item.poster_path : 'https://via.placeholder.com/500x750?text=No+Poster';
        return `
          <div class="movie-card flex-none w-36 sm:w-48 relative rounded-md overflow-hidden bg-neutral-900 group cursor-pointer" data-id="${item.id}" data-type="${type}">
            <img src="${poster}" class="w-full h-52 sm:h-72 object-cover group-hover:scale-105 transition duration-300" loading="lazy" />
            <div class="card-overlay absolute inset-0 bg-black/80 opacity-0 transition duration-300 flex flex-col justify-end p-3">
              <h3 class="text-xs sm:text-sm font-bold text-white truncate">${item.title || item.name}</h3>
              <div class="flex space-x-2 mt-2">
                <button onclick="window.openPlayer('${item.id}', '${type}')" class="bg-red-600 text-white text-xs px-2 py-1 rounded hover:bg-red-700">Play</button>
              </div>
            </div>
          </div>
        `;
      }

      function renderWatchlist() {
        const container = document.getElementById('watchlist-grid');
        if (state.watchlist.length === 0) {
          container.innerHTML = `<p class="text-xs text-neutral-500 py-4">Your list is empty.</p>`;
          return;
        }
        container.innerHTML = state.watchlist.map(item => createMediaCard({
          id: item.media_id,
          title: item.title,
          poster_path: item.poster_path
        }, item.media_type)).join('');
      }

      // 6. STREAMING PLAYER & EVENTS
      window.openPlayer = (id, type) => {
        const playerModal = document.getElementById('player-modal');
        const playerFrame = document.getElementById('player-frame');
        
        // Default stream fallback
        const streamUrl = type === 'tv' 
          ? `https://vidsrc.to/embed/tv/${id}/1/1`
          : `https://vidsrc.to/embed/movie/${id}`;

        playerFrame.src = streamUrl;
        playerModal.classList.remove('hidden');
      };

      function setupEventListeners() {
        document.getElementById('close-player').addEventListener('click', () => {
          const playerModal = document.getElementById('player-modal');
          const playerFrame = document.getElementById('player-frame');
          playerFrame.src = '';
          playerModal.classList.add('hidden');
        });

        // Live Search Handling
        const searchInput = document.getElementById('search-input');
        let searchTimeout;
        
        searchInput.addEventListener('input', (e) => {
          clearTimeout(searchTimeout);
          const query = e.target.value.trim();
          
          if (!query) {
            document.getElementById('search-results-section').classList.add('hidden');
            return;
          }

          searchTimeout = setTimeout(async () => {
            const results = await tmdbFetch(`/search/multi?query=${encodeURIComponent(query)}`);
            if (results && results.results) {
              const grid = document.getElementById('search-grid');
              grid.innerHTML = results.results
                .filter(r => r.poster_path)
                .map(r => createMediaCard(r, r.media_type))
                .join('');
              document.getElementById('search-results-section').classList.remove('hidden');
            }
          }, 300);
        });
      }

      // Run App
      document.addEventListener('DOMContentLoaded', init);
    })();
  </script>
</body>
</html>
