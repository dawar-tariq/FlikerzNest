<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Flickerz Nest</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-neutral-950 text-white min-h-screen font-sans antialiased flex flex-col justify-between">

  <!-- HEADER -->
  <header class="border-b border-neutral-800 bg-neutral-900/50 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center space-x-2 text-red-600 font-bold text-xl tracking-wider">
        <span class="bg-red-600 text-white rounded p-1 text-xs">F</span>
        <span>Flickerz Nest <span class="text-xs text-neutral-400 font-normal">Admin</span></span>
      </a>
      <a href="index.html" class="text-xs text-neutral-400 hover:text-white transition">Back to Site</a>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-4xl mx-auto px-4 py-12 flex-grow w-full">
    
    <!-- AUTHENTICATION VIEW -->
    <div id="auth-container" class="max-w-md mx-auto bg-neutral-900 border border-neutral-800 rounded-xl p-8 shadow-2xl mt-12">
      <div class="space-y-2 mb-6">
        <h1 class="text-2xl font-bold tracking-tight text-white flex items-center space-x-2">
          <span class="w-2.5 h-2.5 bg-red-600 rounded-full inline-block"></span>
          <span>Admin Access Required</span>
        </h1>
        <p class="text-xs text-neutral-400">Sign in with your administrative account to manage application data.</p>
      </div>

      <form id="login-form" class="space-y-4" onsubmit="handleLogin(event)">
        <div>
          <label class="block text-xs font-medium text-neutral-300 mb-1">Email</label>
          <input type="email" id="email-input" autocomplete="off" placeholder="wanidawar03@gmail.com" required
                 class="w-full bg-neutral-950 border border-neutral-800 text-xs rounded-lg px-3 py-2.5 text-white focus:outline-none focus:border-red-600 transition">
        </div>
        <div>
          <label class="block text-xs font-medium text-neutral-300 mb-1">Password</label>
          <input type="password" id="password-input" autocomplete="new-password" placeholder="admin123" required
                 class="w-full bg-neutral-950 border border-neutral-800 text-xs rounded-lg px-3 py-2.5 text-white focus:outline-none focus:border-red-600 transition">
        </div>
        <button type="submit" id="login-btn" class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold text-xs py-2.5 rounded-lg transition">
          Authenticate
        </button>
      </form>
      <p id="auth-error" class="text-red-500 text-xs mt-4 text-center hidden"></p>
    </div>

    <!-- ADMIN DASHBOARD VIEW -->
    <div id="dashboard-container" class="hidden space-y-8">
      <div class="flex justify-between items-center bg-neutral-900 border border-neutral-800 p-4 rounded-xl">
        <div>
          <h2 class="text-lg font-bold">Dashboard Management</h2>
          <p class="text-xs text-neutral-400">Manage watchlist database contents.</p>
        </div>
        <button onclick="handleLogout()" class="bg-neutral-800 hover:bg-neutral-700 text-xs px-3 py-1.5 rounded-lg transition">Sign Out</button>
      </div>

      <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-6 space-y-4">
        <h3 class="text-sm font-bold tracking-wide">Database Records (Watchlist)</h3>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs text-neutral-300">
            <thead class="bg-neutral-950 text-neutral-400 uppercase text-[10px] border-b border-neutral-800">
              <tr>
                <th class="p-3">Title</th>
                <th class="p-3">Type</th>
                <th class="p-3">Media ID</th>
                <th class="p-3 text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="admin-data-list" class="divide-y divide-neutral-800">
              <tr><td colspan="4" class="p-4 text-center text-neutral-500">Loading records...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </main>

  <!-- FOOTER -->
  <footer class="border-t border-neutral-900 bg-neutral-950/90 py-6 text-center text-xs text-neutral-500">
    <p>Flickerz Nest Admin Panel © 2026</p>
  </footer>

  <!-- SCRIPT -->
  <script>
    const config = {
      supabaseUrl: 'https://ctbrfynxmgcyvsrdihfg.supabase.co',
      supabaseKey: 'sb_publishable_4BX5xVy7t6lxpDltwkq2WA_JXb0tVC-'
    };

    // Disable session persistence to prevent mobile 401 token sync issues
    const supabaseClient = window.supabase.createClient(config.supabaseUrl, config.supabaseKey, {
      auth: { persistSession: false, autoRefreshToken: false }
    });

    function checkSession() {
      if (sessionStorage.getItem('flickerz_admin_logged_in') === 'true') {
        showDashboard();
      }
    }

    async function handleLogin(event) {
      event.preventDefault();
      const email = document.getElementById('email-input').value.trim();
      const password = document.getElementById('password-input').value;
      const errorEl = document.getElementById('auth-error');

      errorEl.classList.add('hidden');

      const { data, error } = await supabaseClient
        .from('admin_users')
        .select('*')
        .eq('email', email)
        .maybeSingle();

      if (error) {
        errorEl.textContent = 'DB Error: ' + error.message;
        errorEl.classList.remove('hidden');
        return;
      }

      if (!data) {
        errorEl.textContent = 'No account found with email: ' + email;
        errorEl.classList.remove('hidden');
        return;
      }

      if (data.password === password) {
        sessionStorage.setItem('flickerz_admin_logged_in', 'true');
        showDashboard();
      } else {
        errorEl.textContent = 'Incorrect password.';
        errorEl.classList.remove('hidden');
      }
    }

    function handleLogout() {
      sessionStorage.removeItem('flickerz_admin_logged_in');
      document.getElementById('dashboard-container').classList.add('hidden');
      document.getElementById('auth-container').classList.remove('hidden');
    }

    function showDashboard() {
      document.getElementById('auth-container').classList.add('hidden');
      document.getElementById('dashboard-container').classList.remove('hidden');
      fetchAdminData();
    }

    async function fetchAdminData() {
      const tbody = document.getElementById('admin-data-list');
      
      const { data, error } = await supabaseClient.from('watchlist').select('*');
      
      if (error || !data || data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-neutral-500">No records found.</td></tr>`;
        return;
      }

      tbody.innerHTML = data.map(item => `
        <tr class="hover:bg-neutral-950/50">
          <td class="p-3 font-medium text-white">${item.title}</td>
          <td class="p-3 uppercase text-[10px]"><span class="bg-neutral-800 px-2 py-0.5 rounded">${item.media_type || 'movie'}</span></td>
          <td class="p-3 text-neutral-500 font-mono">${item.media_id}</td>
          <td class="p-3 text-right">
            <button onclick="deleteRecord('${item.media_id}')" class="text-red-500 hover:text-red-400 font-medium">Delete</button>
          </td>
        </tr>
      `).join('');
    }

    async function deleteRecord(mediaId) {
      if (!confirm('Are you sure you want to delete this record?')) return;
      await supabaseClient.from('watchlist').delete().eq('media_id', mediaId);
      fetchAdminData();
    }

    checkSession();
  </script>
</body>
</html>
