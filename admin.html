<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin | Flickerz Nest</title>
<!--
  Dedicated full-screen admin panel.

  It loads the main app (index.html) with ?page=admin, which makes the app:
    - hide the public site (hero, rows, footer, nav)
    - show the control room as a full page instead of a pop-up
    - open the owner sign-in if you are not already an admin

  One codebase, so every tab (Overview, Members, Watchlists, Watch activity,
  Streams, Content, Platform) is identical to the panel inside the main site.
-->
<style>
  html,body{margin:0;height:100%;background:#0a0b0f;color:#f3f4f7;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .boot{display:grid;place-items:center;height:100%;gap:14px;text-align:center}
  .boot .ring{width:46px;height:46px;border:3px solid rgba(255,255,255,.12);border-top-color:#e50914;border-radius:50%;animation:spin .9s linear infinite}
  .boot p{margin:0;color:#9aa0ad;font-size:14px}
  .boot a{color:#fff}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
<script>
  // Forward to the app in admin page mode, keeping any hash (e.g. #admin).
  (function () {
    var target = "index.html?page=admin" + (location.hash || "#admin");
    try { location.replace(target); } catch (e) { location.href = target; }
  })();
</script>
</head>
<body>
  <div class="boot">
    <div class="ring"></div>
    <p>Opening the Flickerz Nest control room&hellip;</p>
    <p><a href="index.html?page=admin#admin">Continue if this takes more than a few seconds</a></p>
  </div>
</body>
</html>
