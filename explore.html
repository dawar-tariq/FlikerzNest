<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Explore | Flickerz Nest</title>
<!-- Explore page: loads the shared app in explore mode (genre, year, rating, language filters). -->
<style>
  html,body{margin:0;height:100%;background:#0a0b0f;color:#f3f4f7;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .boot{display:grid;place-items:center;height:100%;gap:14px;text-align:center}
  .ring{width:46px;height:46px;border:3px solid rgba(255,255,255,.12);border-top-color:#e50914;border-radius:50%;animation:spin .9s linear infinite}
  p{margin:0;color:#9aa0ad;font-size:14px} a{color:#fff}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
<script>
  (function () {
    var hash = location.hash && /^#\/?explore/i.test(location.hash) ? location.hash : "#explore";
    var target = "index.html?page=explore" + hash;
    try { location.replace(target); } catch (e) { location.href = target; }
  })();
</script>
</head>
<body>
  <div class="boot"><div class="ring"></div><p>Opening Explore&hellip;</p><p><a href="index.html#explore">Continue</a></p></div>
</body>
</html>
